name: "[Infra] Sudachi Image"

# The Sudachi sidecar for our own parser (backend/sudachi), deployed as the `sudachi` Kamal accessory. Built like the
# Elasticsearch image: on changes to its own files, tagged by version and by the commit that last touched them.
on:
  push:
    branches: [main]
    paths:
      - backend/sudachi/**
      - .github/workflows/sudachi-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # SudachiPy and SudachiDict versions; keep the dictionary equal to the Elasticsearch image's.
  SUDACHI_IMAGE_TAG: 0.6.10-dict-20260116-user1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve the image tag from the sidecar's own commit
        id: tag
        run: |
          set -euo pipefail
          source_sha=$(git log -1 --format=%H -- backend/sudachi)
          test -n "$source_sha"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Sudachi image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: backend/sudachi
          file: backend/sudachi/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/natsume-197/nadeshiko-sudachi:${{ env.SUDACHI_IMAGE_TAG }}
            ghcr.io/natsume-197/nadeshiko-sudachi:${{ env.SUDACHI_IMAGE_TAG }}-${{ steps.tag.outputs.source_sha }}
          cache-from: type=gha,scope=sudachi
          cache-to: type=gha,mode=max,scope=sudachi
