get:
  tags: [Notifications]
  x-internal: true
  operationId: checkWordWatch
  summary: The reader's alert on one word, if any
  description: What the search page reads to draw its alert button.
  security:
    - SessionCookie: []
  parameters:
    - in: query
      name: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    - in: query
      name: matchMode
      required: false
      schema:
        type: string
        enum: [WORD, EXACT, CONTAINS]
        default: WORD
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [watch]
            properties:
              watch:
                oneOf:
                  - $ref: "../../components/schemas/WordWatch.yaml"
                  - type: "null"
    "400": { $ref: "../../components/responses/BadRequest.yaml" }
    "401": { $ref: "../../components/responses/Unauthorized.yaml" }
    "429": { $ref: "../../components/responses/TooManyRequests.yaml" }
    "500": { $ref: "../../components/responses/InternalServerError.yaml" }
