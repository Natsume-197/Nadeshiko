post:
  tags: [Requests]
  x-internal: true
  operationId: voteContentRequest
  summary: Vote for a request
  description: One vote per account. Voting also subscribes the reader to news on the request.
  security:
    - SessionCookie: []
  parameters:
    - in: path
      name: requestId
      required: true
      description: Public UUID of the request.
      schema: { type: string, format: uuid }
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema: { $ref: "../../components/schemas/ContentRequest.yaml" }
    "400": { $ref: "../../components/responses/BadRequest.yaml" }
    "401": { $ref: "../../components/responses/Unauthorized.yaml" }
    "404": { $ref: "../../components/responses/NotFound.yaml" }
    "429": { $ref: "../../components/responses/TooManyRequests.yaml" }
    "500": { $ref: "../../components/responses/InternalServerError.yaml" }
delete:
  tags: [Requests]
  x-internal: true
  operationId: unvoteContentRequest
  summary: Take back a vote
  security:
    - SessionCookie: []
  parameters:
    - in: path
      name: requestId
      required: true
      description: Public UUID of the request.
      schema: { type: string, format: uuid }
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema: { $ref: "../../components/schemas/ContentRequest.yaml" }
    "400": { $ref: "../../components/responses/BadRequest.yaml" }
    "401": { $ref: "../../components/responses/Unauthorized.yaml" }
    "404": { $ref: "../../components/responses/NotFound.yaml" }
    "429": { $ref: "../../components/responses/TooManyRequests.yaml" }
    "500": { $ref: "../../components/responses/InternalServerError.yaml" }
