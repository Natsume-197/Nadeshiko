post:
  tags: [User]
  x-internal: true
  operationId: syncTrackerConnection
  summary: Manually sync the linked anime tracker list
  description: Fetches the latest anime list from the linked provider and updates catalog matches, subject to tier cooldown.
  security:
    - SessionCookie: []
  responses:
    "200":
      description: Synced
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/TrackerState.yaml"
    "400": { $ref: "../../components/responses/BadRequest.yaml" }
    "401": { $ref: "../../components/responses/Unauthorized.yaml" }
    "404": { $ref: "../../components/responses/NotFound.yaml" }
    "429": { $ref: "../../components/responses/TooManyRequests.yaml" }
    "500": { $ref: "../../components/responses/InternalServerError.yaml" }
