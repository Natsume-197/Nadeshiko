post:
  tags: [Admin]
  x-internal: true
  operationId: cancelAdminEmailBroadcast
  summary: Cancel an in-progress email broadcast between batches
  security:
    - SessionCookie: [ADMIN]
  parameters:
    - name: broadcastId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/AdminEmailBroadcast.yaml"
    "400": { $ref: "../../components/responses/BadRequest.yaml" }
    "401": { $ref: "../../components/responses/Unauthorized.yaml" }
    "403": { $ref: "../../components/responses/Forbidden.yaml" }
    "404": { $ref: "../../components/responses/NotFound.yaml" }
    "500": { $ref: "../../components/responses/InternalServerError.yaml" }
