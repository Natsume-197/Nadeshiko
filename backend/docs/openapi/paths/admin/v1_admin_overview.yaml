get:
  tags:
    - Admin
  x-internal: true
  operationId: getAdminOverview
  summary: Get live summary counts for the admin dashboard
  description: |
    Returns lightweight aggregate counts (open reports, open and boosted content requests,
    users, active patrons and whether the global announcement banner is on) for the admin
    launcher and navigation badges.

  security:
    - ApiKey: [READ_ADMIN]
    - SessionCookie: [ADMIN]
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/AdminOverview.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/Forbidden.yaml"
    "429":
      $ref: "../../components/responses/TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/InternalServerError.yaml"
