get:
  tags:
    - Admin
  x-internal: true
  operationId: listAdminEmails
  summary: List sent emails
  description: |
    Returns the email send log newest first, with each message's delivery status, plus counts
    for the last 24 hours.

  security:
    - SessionCookie: [ADMIN]
  parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Number of results per page
    - name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Number of results to skip
    - name: search
      in: query
      schema:
        type: string
        maxLength: 320
      description: Case-insensitive substring match against the address and username
    - name: kind
      in: query
      schema:
        type: string
        maxLength: 32
      description: Only this email kind
    - name: campaign
      in: query
      schema:
        type: string
        maxLength: 80
      description: Only sends belonging to this campaign key
    - name: status
      in: query
      schema:
        type: string
        enum: [sent, delivered, bounced, complained, failed, suppressed]
      description: Only this delivery status
    - name: days
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 366
      description: Only sends from the last N days
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - emails
              - total
              - last24h
            properties:
              emails:
                type: array
                items:
                  $ref: "../../components/schemas/AdminEmailSend.yaml"
              total:
                type: integer
                description: Sends matching the filters
              last24h:
                type: object
                required: [sent, failed, bounced, suppressed]
                properties:
                  sent:
                    type: integer
                  failed:
                    type: integer
                  bounced:
                    type: integer
                    description: Bounces and complaints
                  suppressed:
                    type: integer
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/Forbidden.yaml"
    "429":
      $ref: "../../components/responses/TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/InternalServerError.yaml"
