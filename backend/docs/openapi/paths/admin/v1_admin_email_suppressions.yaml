get:
  tags:
    - Admin
  x-internal: true
  operationId: listAdminEmailSuppressions
  summary: List suppressed email addresses
  description: |
    Returns the addresses the site will not write to, newest first.

  security:
    - SessionCookie: [ADMIN]
  parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Number of results per page
    - name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Number of results to skip
    - name: search
      in: query
      schema:
        type: string
        maxLength: 320
      description: Case-insensitive substring match against the address
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - suppressions
              - total
            properties:
              suppressions:
                type: array
                items:
                  $ref: "../../components/schemas/AdminEmailSuppression.yaml"
              total:
                type: integer
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/Forbidden.yaml"
    "429":
      $ref: "../../components/responses/TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/InternalServerError.yaml"
