type: object
description: |
  One ranked answer from Nadeshiko's own dictionary, in the shape the word card
  already reads from Shirabe's `words/identify`, so either provider renders the
  same card. Pitch audio is not provided yet.
required:
  - id
  - headword
  - reading
  - common
  - name
  - sourceId
  - dictionary
  - jlpt
  - frequency
  - forms
  - entries
properties:
  id:
    type: string
    description: "`<dictionary>:<ent_seq>`."
    example: "jmdict:1358280"
  headword:
    type: string
    example: 食べる
  reading:
    type: string
    nullable: true
    example: たべる
  common:
    type: boolean
  name:
    type: boolean
    description: A proper name rather than a word.
  sourceId:
    type: string
    description: The JMdict/JMnedict entry sequence number.
    example: "1358280"
  dictionary:
    type: string
    enum: [jmdict, jmnedict]
  jlpt:
    type: string
    nullable: true
    description: Unofficial JLPT level estimate (N5-N1).
    example: N5
  frequency:
    type: integer
    nullable: true
    description: Rank in Nadeshiko's own corpus (1 is the most frequent word); null when not counted.
    example: 19
  frequencyByCategory:
    type: array
    description: |
      Rank in each kind of media the word occurs in, the kind that uses it most first (by occurrences per
      million words of that kind). Absent when not counted.
    items:
      type: object
      required: [category, rank, perMillion]
      properties:
        category:
          type: string
          enum: [ANIME, JDRAMA, YOUTUBE, AUDIOBOOK]
        rank:
          type: integer
          description: 1 is the most frequent word in that kind of media.
          example: 212
        perMillion:
          type: number
          description: Occurrences per million words of that kind of media.
          example: 431.7
  baseForm:
    type: boolean
    description: |
      Present and true when nothing is filed under the text looked up and this word is its dictionary form
      (食べた → 食べる).
  inflection:
    type: array
    description: |
      With `baseForm`: what the conjugation does, in the word card's inflection labels, outermost first.
    items: { type: string }
    example: [past]
  pitch:
    type: array
    description: UniDic accent, at most two patterns. No audio yet.
    items:
      type: object
      required: [downstep]
      properties:
        downstep:
          type: integer
          minimum: 0
          description: 0 is flat (heiban); n is the mora after which the pitch drops.
  parts:
    type: array
    description: |
      The words a compound or expression is made of (捜査本部: 捜査, 本部), content words only, each one
      resolvable by the card. Absent for a word of one piece.
    items:
      type: object
      required: [text, lemma, reading, id]
      properties:
        text: { type: string, example: 捜査 }
        lemma: { type: string, example: 捜査 }
        reading: { type: string, example: ソウサ }
        id: { type: string, example: "jmdict:1399010" }
  furigana:
    type: array
    items:
      type: object
      required: [text]
      properties:
        text: { type: string }
        ruby: { type: string }
  forms:
    type: array
    items:
      type: object
      required: [text, script, common]
      properties:
        text: { type: string }
        script: { type: string, enum: [kanji, kana] }
        common: { type: boolean }
  entries:
    type: array
    items:
      type: object
      required: [dictionary, dictionaryName, senses]
      properties:
        dictionary: { type: string }
        dictionaryName: { type: string }
        senses:
          type: array
          items:
            type: object
            required: [position, definitions, tags]
            properties:
              position: { type: integer }
              definitions:
                type: array
                items:
                  type: object
                  required: [lang, text]
                  properties:
                    lang: { type: string, enum: [en, es] }
                    text: { type: string }
              tags:
                type: array
                items:
                  type: object
                  required: [category, code, label]
                  properties:
                    category: { type: string, enum: [partOfSpeech, misc, field, dialect] }
                    code: { type: string }
                    label: { type: string }
              notes:
                type: array
                items: { type: string }
