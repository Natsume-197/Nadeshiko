type: object
description: |
  One kanji from the authenticated reader's own kanji dictionaries (Yomitan `kanji_bank` and `kanji_meta_bank`, and
  kanji dictionaries shipped as term dictionaries), in their stack order. Empty for a reader without any.
required:
  - entries
  - frequencies
properties:
  entries:
    type: array
    items:
      type: object
      required: [dictionary, dictionaryName, tags]
      properties:
        dictionary:
          type: string
          example: "custom:42"
        dictionaryName:
          type: string
          example: KANJIDIC
        onyomi:
          type: array
          items: { type: string }
          example: [ホン]
        kunyomi:
          type: array
          items: { type: string }
          example: [もと]
        meanings:
          type: array
          items: { type: string }
          example: [book, present, main]
        tags:
          type: array
          items:
            type: object
            required: [category, code, label]
            properties:
              category: { type: string, enum: [partOfSpeech, misc, field, dialect] }
              code: { type: string }
              label: { type: string }
        stats:
          type: array
          description: The dictionary's own figures for the kanji (stroke count, grade, index numbers...).
          items:
            type: object
            required: [code, label, category, value]
            properties:
              code: { type: string, example: strokes }
              label: { type: string, example: Stroke count }
              category: { type: string, example: misc }
              value: { type: string, example: "5" }
        senses:
          type: array
          description: The article of a kanji dictionary shipped as a term dictionary, in the word card's shape.
          items:
            type: object
            required: [position, definitions, tags]
            properties:
              position: { type: integer }
              definitions:
                type: array
                items:
                  type: object
                  required: [lang, text]
                  properties:
                    lang: { type: string, enum: [en, es, ja] }
                    text: { type: string }
                    structuredContent:
                      description: Sanitized Yomitan structured-content AST.
              tags:
                type: array
                items:
                  type: object
                  required: [category, code, label]
                  properties:
                    category: { type: string, enum: [partOfSpeech, misc, field, dialect] }
                    code: { type: string }
                    label: { type: string }
              notes:
                type: array
                items: { type: string }
  frequencies:
    type: array
    description: Ranks from the reader's kanji frequency dictionaries.
    items:
      type: object
      required: [dictionary, dictionaryName, value, displayValue]
      properties:
        dictionary: { type: string }
        dictionaryName: { type: string }
        value:
          type: number
          nullable: true
        displayValue: { type: string }
  stackFingerprint:
    type: string
    nullable: true
    description: Fingerprint of the reader's custom dictionary stack.
  customDictionariesPending:
    type: boolean
    description: >-
      True when the answer lacks one of the reader's enabled dictionaries, still indexing or still being fetched. Such
      an answer must not be cached.
