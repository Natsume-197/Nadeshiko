type: object
required:
  - userId
  - tierId
  - effectiveTierId
  - quotaOverride
  - monthlyQuotaLimit
  - quotaSource
  - quotaUsed
  - periodYyyymm
properties:
  userId:
    type: integer
    example: 328
  tierId:
    type: string
    nullable: true
    description: The tier this account is assigned, or null if it has none
    example: plus
  effectiveTierId:
    type: string
    nullable: true
    description: |
      The tier that produced `monthlyQuotaLimit`: the assigned tier, or the one
      a Patreon membership earns when that is higher. Null when an override or
      a fallback decided the limit.
    example: pro
  quotaOverride:
    type: integer
    nullable: true
    description: Per-account limit that wins over the tier when set
    example: null
  monthlyQuotaLimit:
    type: integer
    description: The limit actually in force, after applying the resolution order
    example: 30000
  quotaSource:
    type: string
    enum: [override, tier, patreon, legacy_column, default]
    description: |
      Which step of the resolution order produced `monthlyQuotaLimit`.
      `patreon` means a linked, active and recently checked Patreon membership
      earns a higher tier than the assigned one; it is computed, never stored,
      so it ends on its own when the membership does.
      `legacy_column` and `default` mean the tier did not resolve, and are worth
      investigating rather than displaying.
    example: patreon
  quotaUsed:
    type: integer
    description: Calls billed to this account in the current period
    example: 4927
  periodYyyymm:
    type: integer
    description: The billing period, as YYYYMM in UTC
    example: 202608
