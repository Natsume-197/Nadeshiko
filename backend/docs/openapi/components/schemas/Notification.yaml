type: object
description: One entry in the reader's notification centre (the bell).
required: [id, kind, payload, read, pinned, groupCount, createdAt]
properties:
  id:
    type: string
    format: uuid
  kind:
    type: string
    enum:
      - word-available
      - word-digest
      - request-update
      - report-resolved
      - site-announcement
      - admin-message
    description: |
      `word-available`: watched words that started returning sentences.
      `word-digest`: new sentences for followed words this week.
      `request-update`: a content request the reader backed changed status.
      `report-resolved`: one or more of the reader's sentence reports were fixed.
      `site-announcement`: official release or site-wide announcement (pinned until read).
      `admin-message`: direct official message from an admin (pinned until read).
  payload:
    type: object
    additionalProperties: true
  read:
    type: boolean
  pinned:
    type: boolean
    description: True for unread official notices pinned at the top of the bell.
  groupCount:
    type: integer
    minimum: 1
    description: Number of folded events represented by this row (1 when not grouped).
  createdAt:
    type: string
    format: date-time
