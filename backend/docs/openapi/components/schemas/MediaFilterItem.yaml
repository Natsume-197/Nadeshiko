type: object
description: A media filter entry with optional episode restriction
required:
  - mediaPublicId
properties:
  mediaPublicId:
    type: string
    description: Media public ID (nanoid)
    pattern: '^[A-Za-z0-9_-]{12}$'
    example: V1StGXR8_Z5d
  episodes:
    type: array
    description: Specific episodes (omit for all episodes). Use 0 for movies/specials
    maxItems: 500
    items:
      type: integer
      minimum: 0
    example: [1, 2]
  minEpisode:
    type: integer
    minimum: 0
    description: Inclusive lower episode bound (e.g. exclude episodes above a reader's current progress)
    example: 7
  maxEpisode:
    type: integer
    minimum: 0
    description: Inclusive upper episode bound (e.g. include only episodes up to a reader's current progress)
    example: 6
