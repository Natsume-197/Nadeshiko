type: object
description: The signed-in user's custom Yomitan dictionary stack, built-in JMdict placement, and account quota.
required:
  - dictionaries
  - builtin
  - quota
  - stackFingerprint
  - directUpload
properties:
  dictionaries:
    type: array
    items:
      $ref: "./UserDictionary.yaml"
  builtin:
    type: object
    required: [id, enabled, position]
    properties:
      id:
        type: string
        example: jmdict
      enabled:
        type: boolean
      position:
        type: integer
  quota:
    type: object
    required: [used, max, maxZipBytes, isPatron, indexedBytesUsed, maxIndexedBytes]
    properties:
      used:
        type: integer
      max:
        type: integer
      maxZipBytes:
        type: integer
      isPatron:
        type: boolean
      indexedBytesUsed:
        type: integer
        description: Disk the account's dictionaries take once indexed, in bytes.
      maxIndexedBytes:
        type: integer
        description: Indexed space the account may use, in bytes; new uploads are refused once it is used up.
  stackFingerprint:
    type: string
    nullable: true
  directUpload:
    type: boolean
    description: Whether uploads go straight to storage (reserve, PUT, complete) rather than through the upload endpoint.
