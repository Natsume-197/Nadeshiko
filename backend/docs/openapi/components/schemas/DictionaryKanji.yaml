type: object
description: |
  One kanji as the word card's kanji view draws it (task 44).
required:
  - character
  - strokeCount
  - grade
  - frequency
  - jlpt
  - radical
  - readings
  - meanings
  - meaningsLanguage
  - components
  - strokes
  - strokeNumbers
  - words
  - sameRadical
  - sameRadicalCount
  - containedIn
  - containedInCount
properties:
  character:
    type: string
    example: 食
  strokeCount:
    type: integer
    example: 9
  grade:
    type: integer
    nullable: true
    description: KANJIDIC2 school grade. 1-6 elementary school, 8 the rest of the jōyō list, 9-10 jinmeiyō.
    example: 2
  frequency:
    type: integer
    nullable: true
    description: Rank among the 2,500 kanji most used in newspapers (KANJIDIC2).
    example: 328
  jlpt:
    type: integer
    nullable: true
    description: Current JLPT level, 5 for N5 (Jonathan Waller's unofficial lists).
    example: 5
  radical:
    type: object
    nullable: true
    description: The classical (Kangxi) radical it is filed under, named by Kanji alive.
    required: [glyph, number, reading, meaning, character]
    properties:
      glyph:
        type: string
        example: ⾷
      number:
        type: integer
        example: 184
      reading:
        type: string
        example: しょく
      meaning:
        type: string
        example: food, to eat
      character:
        type: string
        nullable: true
        description: The kanji the radical is written as, when it has a card.
        example: 食
  readings:
    type: array
    description: On readings first, then kun, each with up to three of the corpus's most frequent words read that way.
    items:
      type: object
      required: [kind, reading, examples]
      properties:
        kind:
          type: string
          enum: [on, kun]
        reading:
          type: string
          description: Katakana for on; hiragana with `.` before the okurigana for kun.
          example: た.べる
        examples:
          type: array
          items:
            $ref: "./DictionaryKanjiWordRef.yaml"
  meanings:
    type: array
    items:
      type: string
    example: [eat, food]
  meaningsLanguage:
    type: string
    enum: [en, es]
    description: The language `meanings` are in; English when KANJIDIC2 has none in the requested one.
  components:
    type: array
    description: The parts it is built from (KRADFILE).
    items:
      type: object
      required: [character, hasCard, meaning]
      properties:
        character:
          type: string
          example: 良
        hasCard:
          type: boolean
          description: The part is a kanji with a card of its own.
        meaning:
          type: string
          nullable: true
          description: The kanji's first meaning, or the radical's (English) for a shape with no card.
          example: good
  strokes:
    type: array
    description: One SVG path per stroke in writing order, in KanjiVG's 109×109 view box. Empty when not drawn.
    items:
      type: string
  strokeNumbers:
    type: array
    description: Where KanjiVG places each stroke's number, as `[x, y]`. Empty when it has none.
    items:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: number
  words:
    type: array
    description: Words written with this kanji, most frequent in Nadeshiko's corpus first (up to 40).
    items:
      type: object
      required: [id, headword, reading, frequency, gloss]
      properties:
        id:
          type: string
          example: "jmdict:1358280"
        headword:
          type: string
          example: 食べる
        reading:
          type: string
          nullable: true
          example: たべる
        frequency:
          type: integer
          description: Rank in Nadeshiko's corpus (1 is the most frequent word).
          example: 195
        gloss:
          type: string
          nullable: true
          example: to eat
  sameRadical:
    type: array
    description: Other kanji filed under the same radical, school kanji first (up to 12).
    items:
      $ref: "./DictionaryKanjiRelated.yaml"
  sameRadicalCount:
    type: integer
    example: 92
  containedIn:
    type: array
    description: Kanji with this one as a part and filed under another radical, school kanji first (up to 12).
    items:
      $ref: "./DictionaryKanjiRelated.yaml"
  containedInCount:
    type: integer
    example: 5
