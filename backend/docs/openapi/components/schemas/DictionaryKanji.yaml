type: object
description: |
  One kanji as the word card's kanji view draws it (task 44).
required:
  - character
  - strokeCount
  - grade
  - frequency
  - onReadings
  - kunReadings
  - meanings
  - meaningsLanguage
  - components
  - strokes
  - words
properties:
  character:
    type: string
    example: 本
  strokeCount:
    type: integer
    example: 5
  grade:
    type: integer
    nullable: true
    description: KANJIDIC2 school grade. 1-6 elementary school, 8 the rest of the jōyō list, 9-10 jinmeiyō.
    example: 1
  frequency:
    type: integer
    nullable: true
    description: Rank among the 2,500 kanji most used in newspapers (KANJIDIC2).
    example: 10
  onReadings:
    type: array
    items:
      type: string
    example: [ホン]
  kunReadings:
    type: array
    items:
      type: string
    example: [もと]
  meanings:
    type: array
    items:
      type: string
    example: [book, present, main, origin]
  meaningsLanguage:
    type: string
    enum: [en, es]
    description: The language `meanings` are in; English when KANJIDIC2 has none in the requested one.
  components:
    type: array
    description: The parts it is built from (KRADFILE).
    items:
      type: object
      required: [character, hasCard]
      properties:
        character:
          type: string
          example: 木
        hasCard:
          type: boolean
          description: The part is a kanji with a card of its own.
  strokes:
    type: array
    description: One SVG path per stroke in writing order, in KanjiVG's 109×109 view box. Empty when not drawn.
    items:
      type: string
  words:
    type: array
    description: Words written with this kanji, most frequent in Nadeshiko's corpus first.
    items:
      type: object
      required: [id, headword, reading, frequency, gloss]
      properties:
        id:
          type: string
          example: "jmdict:1522150"
        headword:
          type: string
          example: 本当
        reading:
          type: string
          nullable: true
          example: ほんとう
        frequency:
          type: integer
          description: Rank in Nadeshiko's corpus (1 is the most frequent word).
          example: 120
        gloss:
          type: string
          nullable: true
          example: truth; reality; actuality
