type: object
description: One custom Yomitan dictionary attached to the user's account.
required:
  - id
  - stackId
  - title
  - revision
  - author
  - description
  - url
  - frequencyMode
  - hasTerms
  - hasFrequency
  - hasPitch
  - termCount
  - frequencyCount
  - pitchCount
  - hasKanji
  - hasKanjiFrequency
  - hasKanjiTerms
  - kanjiCount
  - kanjiFrequencyCount
  - zipBytes
  - sqliteBytes
  - status
  - errorMessage
  - enabled
  - sortOrder
  - createdAt
  - progress
  - queuePosition
properties:
  id:
    type: integer
  stackId:
    type: string
    example: "custom:42"
  title:
    type: string
  revision:
    type: string
  author:
    type: string
    nullable: true
  description:
    type: string
    nullable: true
  url:
    type: string
    nullable: true
  frequencyMode:
    type: string
    nullable: true
  hasTerms:
    type: boolean
  hasFrequency:
    type: boolean
  hasPitch:
    type: boolean
  termCount:
    type: integer
  frequencyCount:
    type: integer
  pitchCount:
    type: integer
  hasKanji:
    type: boolean
    description: Holds kanji entries (Yomitan `kanji_bank`) for the kanji card.
  hasKanjiFrequency:
    type: boolean
    description: Holds kanji frequencies (Yomitan `kanji_meta_bank`).
  hasKanjiTerms:
    type: boolean
    description: >-
      A kanji dictionary shipped as a term dictionary (at least 10% single-kanji headwords): its single-kanji entries
      answer the kanji card too.
  kanjiCount:
    type: integer
  kanjiFrequencyCount:
    type: integer
  zipBytes:
    type: integer
  sqliteBytes:
    type: integer
  status:
    type: string
    enum: [processing, ready, failed]
  errorMessage:
    type: string
    nullable: true
  enabled:
    type: boolean
  sortOrder:
    type: integer
  createdAt:
    type: string
    format: date-time
  progress:
    type: integer
    nullable: true
    minimum: 0
    maximum: 100
    description: How far a running import got, 0-100; null when it is queued, ready or failed.
  queuePosition:
    type: integer
    nullable: true
    minimum: 1
    description: Place in the import queue while waiting to start (1 = next); null once it runs or is done.
